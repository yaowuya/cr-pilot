<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="cr-pilot">
  <!--
    与新版 .app-brand__mark / .brand__mark 使用同一视觉语言：
    扁平蓝灰底、墨色圆角线框和 CR 字标，不再沿用旧版渐变色块。
    浏览器标签不会加载应用 CSS，因此在 SVG 内按系统主题切换颜色。
  -->
  <style>
    .frame { fill: #eef2f7; stroke: #20293a; }
    .word { fill: #20293a; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #151e30; stroke: #f1f5f9; }
      .word { fill: #f1f5f9; }
    }
  </style>
  <rect class="frame" x="4" y="4" width="56" height="56" rx="14" stroke-width="4" />
  <text
    class="word"
    x="32"
    y="33"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="27"
    font-weight="700"
    letter-spacing="0.2"
    text-anchor="middle"
    dominant-baseline="central"
  >CR</text>
</svg>
