services:
  cr-pilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cr-pilot
    # 宿主机 5001 → 容器 5001；如需只内网访问可去掉 ports，改用 network_mode: host
    ports:
      - "5001:5001"

    # 环境变量闭环：compose 原生 env_file 把 .env 全部注入容器 environment，
    # 应用无需再读文件，pi 的 $LLMGW_API_KEY 插值也一定能读到进程环境。
    # .env 文件缺失时 docker compose 直接报错（fail-fast），不会静默空跑。
    env_file:
      - .env
    # 覆盖/固定项：HOST/PORT/PI_CODING_AGENT_DIR 由镜像内 ENV 固定，无需在此重复。
    environment:
      - HOST=0.0.0.0
      - PORT=5001

    # 注意：必须在仓库根目录执行 docker compose；:z 用于 SELinux 环境（relabel 共享卷）。
    volumes:
      # 规则目录与兜底 prompt（项目目录下 prompts → 容器 /app/prompts）
      - ./prompts:/app/prompts:ro,z
      # 日志目录（宿主机 /data/logs/cr-pilot → 容器 /app/logs，应用按 LOG_FILE 写入）
      - /data/logs/cr-pilot:/app/logs
      # SQLite 数据目录（宿主机 /data/cr-pilot → 容器 /app/data）。
      # 必须落在本地盘：WAL 模式不支持网络文件系统。
      # 首次部署需建目录并授权：sudo mkdir -p /data/cr-pilot && sudo chown 1000:1000 /data/cr-pilot
      - /data/cr-pilot:/app/data

    # 生产环境推荐：异常退出自动重启
    restart: unless-stopped

    # 如需访问宿主机网络（如宿主机跑 GitLab），可改为 network_mode: host
    # network_mode: host

    # 健康检查：容器启动后每 30s 探测 /health 端点
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# 无需额外网络/卷声明；默认 bridge 网络即可
